<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation - You're Amazing Faouzi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #4a0404;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .heart-container {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateHeart 10s ease-in-out infinite alternate;
        }

        #ui {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ui .love_word {
            position: absolute;
            color: #ea80b0;
            font-size: 1.1rem;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-shadow: 0 0 8px #fff, 0 0 15px #ea80b0;
            letter-spacing: 1px;
            white-space: nowrap;
            transform-origin: center center;
        }

        @keyframes rotateHeart {
            0% {
                transform: rotateY(-25deg) scale(0.9);
            }
            100% {
                transform: rotateY(25deg) scale(1.1);
            }
        }
    </style>
</head>
<body>

    <div class="heart-container">
        <div id="ui"></div>
    </div>

    <script>
        const ui = document.getElementById('ui');
        const totalWords = 60;
        const textContent = "you're amazing Faouzi";

        for (let i = 0; i < totalWords; i++) {
            const span = document.createElement('span');
            span.className = 'love_word';
            span.innerText = textContent;

            const t = (i / totalWords) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
            const dy = 13 * Math.sin(t) - 10 * Math.sin(2*t) - 6 * Math.sin(3*t) - 4 * Math.sin(4*t);
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);

            const scale = 12; 
            const posX = x * scale;
            const posY = y * scale;

            span.style.transform = `translate(${posX}px, ${posY}px) rotate(${angle}deg)`;
            ui.appendChild(span);
        }
    </script>
</body>
</html>
